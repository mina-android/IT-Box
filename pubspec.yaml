name: itbox
description: IT Box - Inventory Management Application
publish_to: 'none'
version: 1.1.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.4
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.2
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  pdf: ^3.12.0
  shared_preferences: ^2.3.2
  excel: ^4.0.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  fl_chart: ^1.2.0
  url_launcher: ^6.3.0
  google_fonts: '>=8.2.1 <9.0.0'
  dynamic_color: '>=1.9.0 <2.0.0'
  shimmer: ^4.0.0
  animations: ^2.2.0
  drift: ^2.35.0
  ffi: ^2.1.3
  sqlite3_flutter_libs: ^0.6.0+eol
  mobile_scanner: ^7.4.2
  signature: ^5.5.0
  network_info_plus: ^8.2.1
  quick_actions: ^1.0.7
  cryptography: ^2.7.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.35.0
  build_runner: ^2.15.1


flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 31
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
